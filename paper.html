<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文獻閱讀卡｜Tarshar 研讀庫</title>
  <style>
    :root{--ink:#26332c;--muted:#718078;--green:#39775b;--paper:#f4f3ed;--card:#fffefa;--line:#dce3dc;--gold:#c49240;--red:#a74f5c}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:9px;padding:10px clamp(12px,4vw,50px);color:#fff;background:#264f3c}.top a{padding:8px 11px;border:1px solid #ffffff44;border-radius:8px;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.top b{margin-right:auto}.hero{padding:44px clamp(18px,7vw,100px);background:linear-gradient(145deg,#fffefa,#eaf0e9)}.identity{display:flex;align-items:center;gap:10px}.code{padding:6px 10px;border-radius:8px;color:#fff;background:var(--green);font-weight:950}.stars{color:var(--gold)}h1{max-width:900px;margin:14px 0 8px;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(31px,5vw,54px);line-height:1.12}.en{max-width:860px;color:var(--muted);font-size:14px;line-height:1.55}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}.meta span{padding:6px 9px;border:1px solid #d3ded5;border-radius:999px;background:#ffffffaa;font-size:10px;font-weight:800}.layout{max-width:1160px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin:auto;padding:30px 18px 70px}.main{display:grid;gap:16px}.card{padding:22px;border:1px solid var(--line);border-radius:17px;background:var(--card);box-shadow:0 8px 25px #243b2c0b}.card h2{margin:0 0 13px;font-family:Georgia,"Noto Serif TC",serif;font-size:23px}.card h3{margin:18px 0 7px;font-size:14px}.card p{margin:0;color:#526159;line-height:1.75}.verdict{border-left:6px solid var(--green);background:#edf5ee}.verdict p{color:#315341;font-size:17px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{padding:15px;border:1px solid #e3e7e2;border-radius:12px;background:#fafbf8}.mini b{display:block;margin-bottom:7px;color:var(--green);font-size:11px;letter-spacing:.06em}.mini p{font-size:13px}.files{display:flex;flex-wrap:wrap;gap:8px}.files a{padding:9px 11px;border-radius:8px;color:#fff;background:var(--green);text-decoration:none;font-size:11px;font-weight:900}.files .drive{color:#56665d;border:1px solid #ccd7cf;background:#fff}.side{display:grid;align-content:start;gap:16px}.sticky{position:sticky;top:82px}.progress select{width:100%;height:42px;padding:0 10px;border:1px solid #cad6cd;border-radius:9px;background:#fff;font-weight:800}.checklist{display:grid;gap:9px;margin-top:13px}.checklist label{display:flex;gap:8px;align-items:flex-start;color:#59675f;font-size:12px;line-height:1.45}.checklist input{margin-top:2px;accent-color:var(--green)}.field{display:block;margin-top:13px}.field span{display:block;margin-bottom:6px;font-size:11px;font-weight:900}.field textarea,.field input{width:100%;padding:10px;border:1px solid #cdd7cf;border-radius:9px;outline:0;background:#fff;line-height:1.55}.field textarea:focus,.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #39775b14}.field textarea{min-height:92px;resize:vertical}.savebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.savebar button{padding:10px;border:0;border-radius:8px;font-size:11px;font-weight:950;cursor:pointer}.save{color:#fff;background:var(--green)}.export{color:#536258;border:1px solid #cbd7ce;background:#fff}.saved{display:none;margin-top:8px;color:var(--green);font-size:10px;font-weight:900}.evidence{border-top:1px dashed #cfd8d1;margin-top:15px;padding-top:4px}.warning{padding:13px;border-radius:9px;color:#6e5932;background:#fff5df;font-size:11px;line-height:1.55}.next{display:flex;justify-content:space-between;gap:10px}.next a{flex:1;padding:11px;border:1px solid #d2dbd4;border-radius:9px;text-align:center;text-decoration:none;font-size:11px;font-weight:900;background:#fff}.notfound{max-width:700px;margin:80px auto;padding:30px;text-align:center}.notfound a{color:var(--green)}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.sticky{position:static}.side{grid-row:1}.grid{grid-template-columns:1fr}}@media(max-width:560px){.top b{font-size:13px}.top a:nth-of-type(2){display:none}.hero{padding:32px 16px}.layout{padding:18px 12px 55px}.card{padding:18px}.savebar{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><a href="index.html">← 回到研讀庫</a><a href="https://tarshar4242.github.io/kt-sweet-journey/lessons.html">🏠 回筆記館入口</a><b>論文文獻閱讀卡</b><a href="https://tarshar4242-rgb.github.io/ai-course-learning-hub/">所有系列</a></header>
  <div id="app"></div>
  <script src="data.js"></script>
  <script>
    const id=new URLSearchParams(location.search).get('id'),p=PAPERS.find(x=>x.id===id),app=document.querySelector('#app');
    if(!p||!p.verdict){app.innerHTML='<div class="notfound"><h1>這篇文獻的完整閱讀卡尚未建立</h1><p>原始檔案仍可從雲端文獻夾開啟。</p><a href="index.html">返回全部文獻</a></div>';throw new Error('paper not ready')}
    document.title=`${p.id} ${p.title}｜文獻閱讀卡`;
    const files=(p.files||[]).map(([name,url])=>`<a href="${url}" target="_blank">${name}</a>`).join('');
    const order=READING_PATH,index=order.indexOf(p.id),prev=order[index-1],next=order[index+1];
    app.innerHTML=`<section class="hero"><div class="identity"><span class="code">${p.id}</span><span class="stars">${'★'.repeat(p.stars)}</span><span>${p.role}</span></div><h1>${p.title}</h1><div class="en">${p.en||''}</div><div class="meta"><span>${p.author||'待補作者'}</span><span>${p.year||'待補年份'}</span><span>${p.method||'待補方法'}</span><span>${p.status}</span></div></section><div class="layout"><main class="main"><section class="card verdict"><h2>一句話判讀</h2><p>${p.verdict}</p></section><section class="card"><h2>研究拆解</h2><div class="grid"><div class="mini"><b>研究問題</b><p>${p.question}</p></div><div class="mini"><b>理論與概念</b><p>${p.theory}</p></div><div class="mini"><b>研究方法</b><p>${p.method}</p></div><div class="mini"><b>主要發現</b><p>${p.findings}</p></div></div></section><section class="card"><h2>放進自己的論文</h2><div class="grid"><div class="mini"><b>建議用途</b><p>${p.use}</p></div><div class="mini"><b>限制與引用警語</b><p>${p.limit}</p></div></div></section><section class="card"><h2>原始檔案與研讀包</h2><div class="files">${files}<a class="drive" href="${p.drive}" target="_blank" rel="noopener">Google Drive 資料夾</a></div></section><nav class="next">${prev?`<a href="paper.html?id=${prev}">← 上一站 ${prev}</a>`:'<span></span>'}${next?`<a href="paper.html?id=${next}">下一站 ${next} →</a>`:''}</nav></main><aside class="side"><div class="sticky"><section class="card progress"><h2>我的閱讀進度</h2><select id="status"><option>未開始</option><option>快速掃讀</option><option>精讀中</option><option>已完成頁碼證據</option><option>可引用</option><option>已寫入論文</option></select><div class="checklist"><label><input type="checkbox" data-check="identity">已核對書目與 DOI</label><label><input type="checkbox" data-check="method">已確認研究方法與樣本</label><label><input type="checkbox" data-check="evidence">已補至少一筆頁碼證據</label><label><input type="checkbox" data-check="placement">已決定放入論文哪一章</label><label><input type="checkbox" data-check="professor">已留下要問教授的問題</label></div></section><section class="card"><h2>我的研究筆記</h2><label class="field"><span>我自己的理解</span><textarea id="understanding" placeholder="不要抄摘要，用自己的話說這篇在解決什麼問題。"></textarea></label><label class="field"><span>要放入論文的位置</span><input id="placement" placeholder="例如：第二章 2.2 隱性知識外化"></label><div class="evidence"><h3>頁碼證據 1</h3><label class="field"><span>頁碼／圖表</span><input id="page" placeholder="例如：p.18、Table 3"></label><label class="field"><span>支持的主張</span><textarea id="claim" placeholder="這一頁能支持我論文裡哪個主張？"></textarea></label></div><label class="field"><span>要問教授／待查問題</span><textarea id="question" placeholder="記下還不能確定、需要核對或要帶去 meeting 的問題。"></textarea></label><div class="warning">頁碼證據未填以前，只能視為閱讀摘要，不能當作可直接引用的論文證據。</div><div class="savebar"><button class="save" id="save">儲存這篇筆記</button><button class="export" id="export">匯出文字檔</button></div><div class="saved" id="saved">已儲存在這台裝置</div></section></div></aside></div>`;
    const key='paper-note-'+p.id,fields=['status','understanding','placement','page','claim','question'];
    function collect(){const data={};fields.forEach(x=>data[x]=document.querySelector('#'+x).value);data.checks={};document.querySelectorAll('[data-check]').forEach(x=>data.checks[x.dataset.check]=x.checked);return data}
    function load(){const data=JSON.parse(localStorage.getItem(key)||'{}');fields.forEach(x=>{if(data[x])document.querySelector('#'+x).value=data[x]});document.querySelectorAll('[data-check]').forEach(x=>x.checked=!!data.checks?.[x.dataset.check])}load();
    document.querySelector('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify(collect()));const s=document.querySelector('#saved');s.style.display='block';setTimeout(()=>s.style.display='none',1800)};
    document.querySelector('#export').onclick=()=>{const d=collect(),text=`${p.id}｜${p.title}\n\n閱讀狀態：${d.status}\n\n我的理解\n${d.understanding}\n\n放入論文的位置\n${d.placement}\n\n頁碼／圖表\n${d.page}\n\n支持的主張\n${d.claim}\n\n待問教授／待查\n${d.question}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=`${p.id}_我的文獻閱讀筆記.txt`;a.click();URL.revokeObjectURL(a.href)};
  </script>
  <footer style="text-align:center;padding:26px 16px 36px;color:#718078;font-size:12px;line-height:1.9;border-top:1px solid #dce3dc;background:#f4f3ed">🍀 Learn AI with Tarshar ｜2026 · 論文文獻閱讀系列</footer>
</body>
</html>
